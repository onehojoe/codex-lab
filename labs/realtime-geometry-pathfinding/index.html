<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Realtime Geometry Pathfinding</title>
    <link rel="stylesheet" href="styles.css?v=alt2" />
  </head>
  <body>
    <main class="app-shell">
      <a class="lab-home" href="../../index.html">테스트 허브</a>
      <header class="topbar" aria-label="Geometry pathfinding controls">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <h1>Geometry Pathfinding</h1>
            <p id="statusText">시작점 추가 중 · 시작 0 / 도착 0</p>
          </div>
        </div>

        <div class="toolbar" role="toolbar" aria-label="Point and run controls">
          <div class="mode-group" aria-label="Point mode">
            <button class="mode-button is-active" id="startModeButton" type="button" data-mode="start">
              <span class="dot dot-start" aria-hidden="true"></span>
              시작점
            </button>
            <button class="mode-button" id="endModeButton" type="button" data-mode="end">
              <span class="dot dot-end" aria-hidden="true"></span>
              도착점
            </button>
            <button class="mode-button" id="obstacleModeButton" type="button" data-mode="obstacle">
              <span class="dot dot-obstacle" aria-hidden="true"></span>
              장애물
            </button>
          </div>

          <div class="shape-group" aria-label="Obstacle shape">
            <button class="shape-button is-active" id="circleShapeButton" type="button" data-shape="circle">원</button>
            <button class="shape-button" type="button" data-shape="triangle">삼각</button>
            <button class="shape-button" type="button" data-shape="square">사각</button>
            <button class="shape-button" type="button" data-shape="pentagon">오각</button>
          </div>

          <div class="route-group" aria-label="Route method">
            <label for="routeModeSelect">선</label>
            <select id="routeModeSelect">
              <option value="shortest-road" selected>최단 도로선</option>
              <option value="shortest">최단 그래프</option>
              <option value="straight">직선</option>
              <option value="arc">호</option>
              <option value="dogleg">직교</option>
              <option value="wave">파동</option>
              <option value="probe">탐욕</option>
              <option value="orbit">회전</option>
              <option value="cycle">순환</option>
            </select>
          </div>

          <div class="route-tune" id="routeTunePanel" aria-label="Selected route settings" hidden>
            <div class="route-picker" id="routePicker"></div>
            <label for="clothoidRadiusSlider">반경</label>
            <input id="clothoidRadiusSlider" type="range" min="40" max="180" value="100" />
            <input id="clothoidRadiusValue" type="number" min="40" max="180" value="100" />
          </div>

          <div class="image-group" aria-label="Image obstacle recognition">
            <button class="image-button" id="imageButton" type="button">이미지</button>
            <label for="thresholdSlider">명도</label>
            <input id="thresholdSlider" type="range" min="0" max="255" value="128" />
            <label class="toggle-label" for="brightAreaToggle">
              <input id="brightAreaToggle" type="checkbox" />
              밝은면
            </label>
            <button class="image-button" id="detectImageButton" type="button" disabled>인식</button>
            <input id="imageInput" type="file" accept="image/*" hidden />
          </div>

          <div class="action-group" aria-label="Run controls">
            <button class="run-button" id="runButton" type="button" disabled>시작</button>
            <button class="pattern-button" id="patternButton" type="button" disabled>대안</button>
            <button class="commit-button" id="commitPatternButton" type="button" disabled>확정</button>
            <button class="ghost-button" id="resetButton" type="button">초기화</button>
          </div>
        </div>
      </header>

      <section class="stage-wrap" aria-label="Pathfinding stage">
        <canvas id="stage" aria-label="Pathfinding canvas"></canvas>

        <aside class="readout" aria-label="Attempt readout">
          <dl>
            <div>
              <dt>시도</dt>
              <dd id="attemptText">00</dd>
            </div>
            <div>
              <dt>방식</dt>
              <dd id="strategyText">대기</dd>
            </div>
            <div>
              <dt>대안</dt>
              <dd id="patternText">대기</dd>
            </div>
            <div>
              <dt>점</dt>
              <dd id="countText">0 x 0</dd>
            </div>
            <div>
              <dt>장애물</dt>
              <dd id="obstacleText">0</dd>
            </div>
            <div>
              <dt>거리</dt>
              <dd id="distanceText">0 px</dd>
            </div>
          </dl>
        </aside>
      </section>
    </main>

    <script src="app.js?v=alt2"></script>
  </body>
</html>
